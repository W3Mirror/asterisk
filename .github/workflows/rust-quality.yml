name: Rust quality

on:
  pull_request:
  push:
    branches:
      - aistack/main
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:
    inputs:
      lifecycle_soak:
        description: Run the dedicated two-hour mixed-lifecycle soak
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rust-quality-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle-soak:
    name: Two-hour lifecycle soak
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.lifecycle_soak)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run two-hour mixed-lifecycle soak
        run: tests/rust-lifecycle-soak/run.sh

  signaling-capacity:
    name: Signaling capacity matrix
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run 1,000/5,000/10,000 concurrent-call signaling matrix
        run: tests/rust-signaling-capacity/run.sh

  workspace:
    name: Workspace checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Detect Rust workspace
        id: rust-workspace
        shell: bash
        run: |
          if [[ -f Cargo.toml ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No Rust workspace exists on this stack layer; skipping workspace checks."
          fi
      - name: Install stable Rust
        if: steps.rust-workspace.outputs.available == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        if: steps.rust-workspace.outputs.available == 'true'
        run: cargo fmt --all -- --check
      - name: Run workspace tests
        if: steps.rust-workspace.outputs.available == 'true'
        run: cargo test --workspace --locked
      - name: Run local SIPp integration scenarios
        if: steps.rust-workspace.outputs.available == 'true'
        run: tests/rust-sipp/run.sh
      - name: Run deterministic signaling reclamation smoke
        if: steps.rust-workspace.outputs.available == 'true'
        run: cargo run -p load-smoke --locked -- 512 32
      - name: Run deterministic media reclamation smoke
        if: steps.rust-workspace.outputs.available == 'true'
        run: cargo run -p load-smoke --locked -- media 64 8 32 4
      - name: Run deterministic WebSocket media reclamation smoke
        if: steps.rust-workspace.outputs.available == 'true'
        run: cargo run -p load-smoke --locked -- websocket 64 8 32 4
      - name: Run deterministic combined signaling and media reclamation smoke
        if: steps.rust-workspace.outputs.available == 'true'
        run: cargo run -p load-smoke --locked -- combined 64 8 32 4
      - name: Run short mixed-lifecycle reclamation soak
        if: steps.rust-workspace.outputs.available == 'true'
        run: cargo run -p load-smoke --locked -- soak 8 0 12 8 4 2 16777216
      - name: Run extended signaling reclamation load
        if: steps.rust-workspace.outputs.available == 'true' && github.event_name == 'schedule'
        run: cargo run -p load-smoke --locked -- 16384 256
      - name: Run extended media reclamation load
        if: steps.rust-workspace.outputs.available == 'true' && github.event_name == 'schedule'
        run: cargo run -p load-smoke --locked -- media 4096 256 128 8
      - name: Run extended WebSocket media reclamation load
        if: steps.rust-workspace.outputs.available == 'true' && github.event_name == 'schedule'
        run: cargo run -p load-smoke --locked -- websocket 4096 256 128 8
      - name: Run extended combined signaling and media reclamation load
        if: steps.rust-workspace.outputs.available == 'true' && github.event_name == 'schedule'
        run: cargo run -p load-smoke --locked -- combined 4096 256 128 8
      - name: Run extended property tests
        if: steps.rust-workspace.outputs.available == 'true' && github.event_name == 'schedule'
        env:
          PROPTEST_CASES: "4096"
        run: cargo test -p property-tests --locked
      - name: Run workspace clippy
        if: steps.rust-workspace.outputs.available == 'true'
        run: cargo clippy --workspace --all-targets --locked

  fuzz:
    name: Protocol fuzz checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Detect protocol fuzz workspace
        id: protocol-fuzz
        shell: bash
        run: |
          if [[ -f fuzz/Cargo.toml ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No protocol fuzz workspace exists on this stack layer; skipping fuzz checks."
          fi
      - name: Install nightly Rust
        if: steps.protocol-fuzz.outputs.available == 'true'
        uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        if: steps.protocol-fuzz.outputs.available == 'true'
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Check all fuzz targets with address sanitizer
        if: steps.protocol-fuzz.outputs.available == 'true'
        run: cargo +nightly fuzz check --fuzz-dir fuzz --sanitizer address --no-cfg-fuzzing

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Detect locked Rust dependencies
        id: rust-dependencies
        shell: bash
        run: |
          if [[ -f Cargo.toml && -f Cargo.lock ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No locked Rust dependency graph exists on this stack layer; skipping dependency audit."
          fi
      - name: Install stable Rust
        if: steps.rust-dependencies.outputs.available == 'true'
        uses: dtolnay/rust-toolchain@stable
      - name: Audit Rust dependencies
        if: steps.rust-dependencies.outputs.available == 'true'
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
