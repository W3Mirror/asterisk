services:
  asterisk:
    build:
      context: .
      dockerfile: Dockerfile
    image: asterisk:22.10.1-aistack
    container_name: asterisk
    hostname: asterisk
    networks:
      - aistack

    # Bridge networking (not network_mode: host): asterisk, prometheus,
    # grafana, portal and caddy all talk to each other by service name over
    # the aistack network (e.g. Prometheus scrapes http://asterisk:8088/metrics,
    # Grafana queries http://prometheus:9090). Caddy is the only service that
    # publishes a websocket-facing port to the host; it fronts asterisk's
    # websocket-based stack (PJSIP transport-ws, chan_websocket media/
    # control, ARI, and the Prometheus /metrics route from
    # docker/etc-asterisk/prometheus.conf) at /ws, /media/*, /ari*, and
    # /metrics.
    #
    # ports:
    #   - "8088:8088/tcp"  # uncomment for direct websocket access bypassing caddy

    # --- Classic SIP/RTP clients (not needed for the websocket stack) ---
    # Uncomment if you need plain UDP SIP phones/trunks or WebRTC/native
    # RTP media to reach this container. The RTP range MUST match
    # docker/etc-asterisk/rtp.conf's rtpstart/rtpend.
    #
    # ports:
    #   - "5060:5060/udp"
    #   - "10000-10100:10000-10100/udp"

    # --- Meta WhatsApp Business Calling trunk (direct public SIP-TLS) ---
    # Unlike Caddy's 7231 (deliberately bound to loopback + tailscale
    # only, see docs-internal/security.mdx), these two ARE bound to
    # 0.0.0.0 -- deliberately, since sip-trunk.w3.run:5061 is a public
    # SIP trunk endpoint Meta connects to directly from AS32934 IPs, not
    # something reachable via Tailscale or a tunnel. The actual access
    # control is the DOCKER-USER/META-SIP iptables allowlist set up by
    # docker/scripts/meta-allowlist.sh (ufw does NOT filter Docker's
    # DNAT'd published ports -- see docs-internal/operations/
    # lessons-learned.mdx), not interface binding. 5061 is PJSIP's
    # [transport-tls] (see pjsip.conf); the RTP range is shared with the
    # commented native-RTP block above and MUST stay in sync with
    # docker/etc-asterisk/rtp.conf's rtpstart/rtpend.
    ports:
      - "5061:5061/tcp"
      - "10000-10100:10000-10100/udp"

    volumes:
      - ./docker/etc-asterisk:/etc/asterisk:ro
      - asterisk-spool:/var/spool/asterisk
      - asterisk-log:/var/log/asterisk

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show uptime"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    hostname: prometheus
    networks:
      - aistack
    # Deliberately NOT published to the host -- only Grafana (and anything
    # else on the aistack network) can reach it, at http://prometheus:9090.
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: loki
    hostname: loki
    networks:
      - aistack
    # Not published -- only reachable at http://loki:3100 from promtail
    # (pushing logs) and Grafana (querying via the provisioned datasource,
    # see docker/grafana/provisioning/datasources/datasource.yml).
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    hostname: promtail
    networks:
      - aistack
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./docker/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      # Needed for promtail's docker_sd_configs to discover containers and
      # fetch their logs via the Docker API -- no host log-file mounts
      # required. Read-only.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped
    # No ports: -- internal only.

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    hostname: grafana
    networks:
      - aistack
    environment:
      # CHANGE THIS for anything beyond local dev/demo.
      - GF_SECURITY_ADMIN_PASSWORD=changeme
      # Served behind caddy under /grafana -- see docker/caddy/Caddyfile.
      - GF_SERVER_ROOT_URL=http://100.69.165.55:7231/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      # Caddy's basic_auth already gates the whole /grafana/* path (see
      # docker/caddy/Caddyfile), so requiring a *second*, separate Grafana
      # login on top of that would be redundant friction for viewers.
      # Anonymous access here is scoped to Viewer only -- editing/admin
      # still requires signing in at /grafana/login with the real Grafana
      # admin credentials (GF_SECURITY_ADMIN_PASSWORD above).
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* vars are inlined by Next.js at `next build` time (this
      # page is statically prerendered -- app/page.tsx has no dynamic APIs),
      # so setting NEXT_PUBLIC_GRAFANA_URL only under `environment:` below
      # has NO effect on the already-built image. It must also be passed
      # here as a build arg and the image rebuilt whenever this URL changes.
      args:
        NEXT_PUBLIC_GRAFANA_URL: http://100.69.165.55:7231/grafana
    container_name: portal
    hostname: portal
    networks:
      - aistack
    environment:
      ARI_BASE_URL: http://asterisk:8088/ari
      ARI_USERNAME: aistack
      # ARI_PASSWORD comes from env_file below (gitignored .env.aistack) --
      # NOT hardcoded here since this file is committed. Read at runtime by
      # portal/lib/ari.ts (not a NEXT_PUBLIC_* build-time var), so rotating
      # it only needs `docker compose up -d portal`, no rebuild. Keep it in
      # sync with docker/etc-asterisk/secrets/ari_secret.conf.
      # Kept in sync with build.args above for documentation purposes --
      # this env var itself is NOT read at runtime by the prerendered page.
      NEXT_PUBLIC_GRAFANA_URL: http://100.69.165.55:7231/grafana
    env_file: .env.aistack
    depends_on:
      - asterisk
    restart: unless-stopped
    # No ports: -- only reachable via the caddy edge proxy on the aistack
    # network.

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    hostname: caddy
    networks:
      - aistack
    # THE ONLY published port in this compose file -- single entrypoint for
    # the whole stack (portal, grafana under /grafana, asterisk's ARI/ws/
    # metrics routes). See docker/caddy/Caddyfile for routing.
    #
    # Bound explicitly to loopback + the tailscale interface only (NOT
    # 0.0.0.0) so :7231 is unreachable from the host's public/LAN
    # interface -- ufw does not filter Docker's DNAT'd published ports (see
    # docs-internal/security.mdx), so interface-scoped binding is the
    # mitigation that actually works. Public exposure for sip.w3.run goes
    # through the cloudflared service instead (see below), which reaches
    # Caddy over the internal aistack network, not through this port.
    ports:
      - "127.0.0.1:7231:80"
      - "100.69.165.55:7231:80"
    environment:
      # bcrypt hash of the HTTP Basic Auth password for the `admin` user
      # (see docker/caddy/Caddyfile's basic_auth blocks). Generated with:
      #   docker compose exec caddy caddy hash-password --plaintext '<pw>'
      # NOTE the doubled `$$`: docker compose interpolates single `$` in
      # this file itself before the value ever reaches the container, and
      # bcrypt hashes are full of literal `$` separators (e.g.
      # $2a$14$...) -- `$$` is how compose escapes a literal `$`.
      - CADDY_ADMIN_HASH=$$2a$$14$$Uyqh/Ix0RNcz81k/tc6RfOTEFCpEaPJ1nDekWfjgApjATOgCsUv3O
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - portal
      - asterisk
      - grafana
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    hostname: cloudflared
    command: tunnel --no-autoupdate run
    networks:
      - aistack
    # TUNNEL_TOKEN comes from env_file (gitignored .env.aistack) -- never
    # hardcode a real token here, this file is committed.
    env_file: .env.aistack
    depends_on:
      - caddy
    restart: unless-stopped
    # No ports: -- cloudflared makes an OUTBOUND connection to Cloudflare's
    # edge, no inbound port needs publishing. In the Cloudflare Zero Trust
    # dashboard, this tunnel's public hostname ingress (sip.w3.run) must
    # point at http://caddy:80 -- NOT localhost:7231 -- since cloudflared
    # reaches Caddy over this same aistack docker network. Cloudflare
    # preserves the original Host header, so docker/caddy/Caddyfile's
    # host-scoped sip.w3.run block (SIP/WS/media/ARI only, no basic auth,
    # everything else 404) is what actually gets served.
    #
    # NOTE: .env.aistack ships with an empty TUNNEL_TOKEN placeholder.
    # Until a real token is set, this container will crash-loop on start
    # (restart: unless-stopped keeps retrying) -- that's expected and does
    # NOT affect any other service. Set the token, then:
    #   docker compose up -d cloudflared

networks:
  aistack:
    driver: bridge

volumes:
  asterisk-spool:
  asterisk-log:
  prometheus-data:
  grafana-data:
  caddy_data:
  caddy_config:
  loki-data:
