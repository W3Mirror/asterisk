; pjsip.conf - minimal config for the Docker image.
;
; One UDP transport for regular SIP phones/trunks, one WebSocket transport
; for browser-based SIP (rides on the http.conf server on port 8088), and
; a single demo extension (6001) in the from-internal context defined in
; extensions.conf. Its auth password lives in secrets/pjsip_auth.conf
; (gitignored) -- see the #include below.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0

;===================== Demo extension 6001 =====================

[6001]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
allow=alaw
auth=6001
aors=6001
direct_media=no

; [6001] type=auth (username/password) lives in secrets/pjsip_auth.conf --
; gitignored, not committed. See secrets/pjsip_auth.conf.example for the
; template and secrets/.gitignore for what's excluded. Rotate the password
; there, then: docker compose exec asterisk asterisk -rx "module reload res_pjsip.so"
#include "secrets/pjsip_auth.conf"

[6001]
type=aor
max_contacts=5
remove_existing=yes
