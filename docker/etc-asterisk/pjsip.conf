; pjsip.conf - minimal config for the Docker image.
;
; One UDP transport for regular SIP phones/trunks, one WebSocket transport
; for browser-based SIP (rides on the http.conf server on port 8088), one
; TLS transport for the public Meta WhatsApp Business Calling trunk (see
; below), and a single demo extension (6001) in the from-internal context
; defined in extensions.conf. Its auth password lives in
; secrets/pjsip_auth.conf (gitignored) -- see the #include below.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0

;===================== Meta WhatsApp Business Calling trunk =====================
;
; Direct public SIP-TLS exposure ("Option 3"): Meta connects straight to
; this Asterisk instance on 5061/tcp with mandatory SRTP media -- no SBC,
; no third-party trunking provider in between. See docs-internal's
; operations runbook and security.mdx for the full writeup; short version
; below.
;
; cert_file/priv_key_file point at secrets/tls/ (gitignored, same pattern
; as secrets/pjsip_auth.conf and secrets/ari_secret.conf -- see
; secrets/.gitignore). Until DNS for sip-trunk.w3.run is live and
; docker/scripts/issue-cert.sh has run successfully, these are a
; self-signed placeholder so the transport can bind and this config can
; be validated end-to-end (TCP/TLS handshake works, just not against a
; CA Meta will trust). Once the real Let's Encrypt cert lands, no config
; change is needed here -- the script overwrites the same two filenames
; and reloads res_pjsip.so.
;
; mTLS is explicitly NOT used -- Meta does not support presenting a
; client certificate, so verify_client/require_client_cert are off. The
; firewall allowlist (docker/scripts/meta-allowlist.sh, restricting
; 5061/tcp to AS32934's published ranges) is the access-control boundary
; here instead of mutual TLS.
;
; external_signaling_address/external_media_address: this container sits
; behind Docker's own NAT (the aistack bridge network) even though the
; host's public IP is otherwise routed directly with no additional
; upstream NAT -- without these, SDP/Contact headers would advertise the
; container's private 172.x address instead of the host's public IP.
; **UPDATE THIS if the host's public IP ever changes** (see `curl -4 -s
; ifconfig.me` in the runbook) -- it is not auto-detected.
[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/secrets/tls/fullchain.pem
priv_key_file=/etc/asterisk/secrets/tls/privkey.pem
method=tlsv1_2
verify_client=no
require_client_cert=no
external_signaling_address=195.201.246.125
external_media_address=195.201.246.125

; Endpoint identification: Meta's calling IPs rotate within AS32934 (see
; docker/scripts/meta-allowlist.sh) so a source-IP `identify` match (the
; usual mechanism -- see res_pjsip_endpoint_identifier_ip.c) would need
; constant upkeep to stay correct, and there is no res_pjsip_endpoint_
; identifier_header module in this build (checked: only _ip, _user, and
; _anonymous are compiled -- `module show like endpoint_identifier`).
;
; What this Asterisk 22 tree's res_pjsip_endpoint_identifier_ip.so DOES
; support, though (and what's used below), is `match_header` on an
; `identify` object -- added upstream in 13.15.0/14.4.0, still present
; here (see res/res_pjsip_endpoint_identifier_ip.c's header_identify_
; match_check()). It matches a named SIP header's value against a plain
; string or, if wrapped in slashes, a regex -- independent of source IP.
; Meta's INVITEs present calls from the wa.meta.vc domain (per Meta's
; WhatsApp Business Calling docs), which shows up in the From header, so
; matching that domain there is a source-IP-independent, non-anonymous
; way to route only genuinely Meta-presented calls to the [meta-wa]
; endpoint below. It does NOT itself verify the call came from Meta's
; network (header values are trivially spoofable) -- that's what the
; iptables allowlist is for. The two together (network-level source IP
; restricted to AS32934, SIP-level routing keyed off the claimed
; From-domain) is the most correct mechanism available in this build;
; falling back to res_pjsip_endpoint_identifier_anonymous.so (mapping ALL
; unauthenticated INVITEs on this transport to [meta-wa]) was considered
; and rejected because it's strictly less specific than match_header for
; no operational benefit here.
[meta-wa-identify]
type=identify
endpoint=meta-wa
match_header=From: /wa\.meta\.vc/

[meta-wa]
type=endpoint
context=from-meta
transport=transport-tls
disallow=all
allow=ulaw
allow=alaw
allow=g722
; Opus is negotiated pass-through only in this build -- res_format_attr_
; opus.so (attribute/fmtp negotiation) is loaded but there is no
; codec_opus.so, so Asterisk cannot transcode opus<->anything. This is
; fine end-to-end if both legs use opus, but any leg that doesn't
; (e.g. Playback() of a ulaw/alaw sound file straight to a WhatsApp
; caller) will fail to negotiate. Listed last so ulaw/alaw/g722 are
; preferred when Asterisk has a choice. See `core show codecs` /
; `core show translation` and docs-internal/reference/asterisk-config.mdx.
allow=opus
; Mandatory SRTP media, DTLS-SRTP preferred (what Meta's docs specify).
media_encryption=dtls
media_encryption_optimistic=no    ; required, not best-effort -- reject the call rather than fall back to plain RTP
dtls_auto_generate_cert=yes        ; self-signs a DTLS cert per Asterisk restart; Meta validates the exchanged fingerprint (SDP a=fingerprint), not the cert's CA chain, so this is fine and needs no real PKI cert
dtls_verify=no                     ; no client cert expected from Meta's DTLS handshake either (mirrors verify_client=no on the transport)
dtls_setup=actpass
; NOTE: NOT setting webrtc=yes -- that shortcut also force-enables
; ice_support, use_avpf, and rtcp_mux (see pjsip_configuration.c), none
; of which apply to a plain SIP-TLS trunk; only media_encryption=dtls is
; wanted here. See res_pjsip_sdp_rtp.c's setup_media_encryption() --
; DTLS-SRTP negotiation is independent of the ICE/WebRTC path.
;
; SDES fallback (acceptable per Meta's spec but DTLS-SRTP is preferred --
; do not enable both at once, media_encryption is single-valued):
;media_encryption=sdes
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no
from_domain=sip-trunk.w3.run

;===================== Demo extension 6001 =====================

[6001]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
allow=alaw
auth=6001
aors=6001
direct_media=no

; [6001] type=auth (username/password) lives in secrets/pjsip_auth.conf --
; gitignored, not committed. See secrets/pjsip_auth.conf.example for the
; template and secrets/.gitignore for what's excluded. Rotate the password
; there, then: docker compose exec asterisk asterisk -rx "module reload res_pjsip.so"
#include "secrets/pjsip_auth.conf"

[6001]
type=aor
max_contacts=5
remove_existing=yes
