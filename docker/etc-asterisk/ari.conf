; ari.conf - minimal ARI config for the Docker image.
;
; Served over the same built-in HTTP server as /metrics and the PJSIP WS
; transport (http.conf, port 8088), e.g. http://asterisk:8088/ari/ .

[general]
enabled = yes

; [aistack] user (including its password) lives in secrets/ari_secret.conf --
; gitignored, not committed. See secrets/ari_secret.conf.example for the
; template and secrets/.gitignore for what's excluded. Keep the password in
; sync with .env.aistack's ARI_PASSWORD (read by the portal at runtime).
; Rotate, then: docker compose exec asterisk asterisk -rx "module reload res_ari.so"
#include "secrets/ari_secret.conf"
