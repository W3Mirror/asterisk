; ari.conf - minimal ARI config for the Docker image.
;
; Served over the same built-in HTTP server as /metrics and the PJSIP WS
; transport (http.conf, port 8088), e.g. http://asterisk:8088/ari/ .

[general]
enabled = yes

[aistack]
type = user
read_only = no
; CHANGE THIS before using anywhere beyond local dev/demo.
password = changeme-ari
