; extensions.conf - minimal dialplan for the Docker image.

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]

[from-internal]
; Dial 100 to hear a test announcement -- confirms audio/RTP and the
; pjsip endpoint (6001, see pjsip.conf) are working end to end.
exten => 100,1,Answer()
 same => n,Playback(hello-world)
 same => n,Hangup()

; Example: bridge a call to a browser client connected over the native
; WebSocket channel driver (chan_websocket, see chan_websocket.conf).
; "INCOMING" below is the WebSocket connection/session name your client
; registers under; c(ulaw) forces the codec chan_websocket offers.
; Uncomment and adjust once you have a WebSocket client dialing in/out.
;exten => 200,1,Answer()
; same => n,Dial(WebSocket/INCOMING/c(ulaw))
; same => n,Hangup()

; Meta WhatsApp Business Calling trunk (see pjsip.conf's [meta-wa]/
; [transport-tls]). Calls arrive here as INVITE sip:+<number>@sip-trunk.w3.run
; matched to the [meta-wa] endpoint via the [meta-wa-identify] From-header
; match, which sets this context. ${EXTEN} is the dialed number (the
; WhatsApp Business number Meta is routing the call to), so pattern-match
; on it once more than one number is in play; for now everything lands on
; the same demo answer.
[from-meta]
; Placeholder demo routing -- proves the trunk, TLS, and SRTP negotiation
; all work end to end before any real call handling exists.
exten => _+X.,1,Answer()
 same => n,Playback(hello-world)
 same => n,Hangup()

; This is where the AI stack hooks in: once there's a real handler,
; replace the Answer()/Playback()/Hangup() above with something like:
;exten => _+X.,1,Answer()
; same => n,Dial(WebSocket/INCOMING/c(ulaw))   ; bridge to the AI agent's
;                                                ; chan_websocket session,
;                                                ; same mechanism as the
;                                                ; extension 200 example
;                                                ; above -- or Stasis(...)
;                                                ; to hand the call to an
;                                                ; ARI application instead.

; Outbound: calling a WhatsApp user *through* Meta's trunk (not yet
; wired into any dialplan that originates calls -- reference only).
; PJSIP/<target>@meta-wa with an explicit sip: URI bypasses the AOR
; lookup entirely (meta-wa has no aors= -- this is an inbound-identified
; trunk, not a registration), and ;transport=tls pins it onto
; [transport-tls] regardless of the dialed number's format:
;same => n,Dial(PJSIP/sip:+15551234567@wa.meta.vc\;transport=tls@meta-wa)
