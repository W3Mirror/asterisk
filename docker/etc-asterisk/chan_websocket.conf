; chan_websocket.conf - minimal config for the Docker image.
;
; chan_websocket is the native WebSocket media/control channel driver
; (Dial(WebSocket/...)), separate from the PJSIP transport-ws signaling
; transport in pjsip.conf. Left at its defaults (plain-text control
; messages); switch to JSON control messages if your WebSocket client
; expects structured control frames instead of the legacy single-line
; format.

;[global]
;control_message_format = json  ; plain-text (default) or json
