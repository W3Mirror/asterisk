; http.conf - minimal config for the Docker image.
;
; Backs both the plain ARI/AMI-over-HTTP interface and the PJSIP
; transport-ws (SIP-over-WebSocket) transport defined in pjsip.conf, since
; the WS transport rides on top of this built-in HTTP server.

[general]
enabled=yes
bindaddr=0.0.0.0
bindport=8088

; TLS is not configured out of the box in this minimal image; enable and
; point at real cert/key files (mounted in) if you need wss:// / https://.
;tlsenable=yes
;tlsbindaddr=0.0.0.0:8089
;tlscertfile=/etc/asterisk/keys/asterisk.crt
;tlsprivatekey=/etc/asterisk/keys/asterisk.key
