; logger.conf - minimal config for the Docker image.
;
; Logs go to /var/log/asterisk (a named volume, see compose.yml) as well
; as full verbose/debug to the console, which Docker captures as the
; container's stdout/stderr (`docker compose logs`).

[general]

[logfiles]
console => notice,warning,error,verbose
messages => notice,warning,error
full => notice,warning,error,debug,verbose
