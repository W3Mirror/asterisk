; prometheus.conf - res_prometheus config for the Docker image.
;
; Serves Asterisk metrics on the built-in HTTP server (see http.conf,
; port 8088) at /metrics, which Prometheus (the "prometheus" service in
; compose.yml) scrapes over the aistack docker network at
; http://asterisk:8088/metrics -- see docker/prometheus/prometheus.yml.
;
; Option names verified against configs/samples/prometheus.conf.sample in
; this tree.

[general]
enabled = yes                     ; res_prometheus.so must be loaded (it is,
                                  ; via modules.conf autoload=yes) and
                                  ; Asterisk's HTTP server must be enabled
                                  ; (see http.conf) for this to take effect.
core_metrics_enabled = yes

uri = metrics                     ; -> http://asterisk:8088/metrics

; Note: port 8088 IS published to the host (compose.yml) so external SIP
; clients can reach chan_websocket/ARI/WS, which also means /metrics is
; reachable from outside the aistack docker network, not just from
; Prometheus. Basic Auth is left off here for a quick local demo; turn it
; on for anything beyond that:
;auth_username = Asterisk
;auth_password = changeme-prometheus
