; rtp.conf - minimal config for the Docker image.
;
; Keep this range in sync with:
;   - EXPOSE 10000-10100/udp in the Dockerfile
;   - compose.yml's asterisk service `ports:` -- published as
;     10000-10100/udp for the Meta SIP-TLS trunk's RTP/SRTP media (see
;     pjsip.conf's [meta-wa] endpoint). Also used by any native-RTP SIP
;     phone/trunk if that commented example is ever enabled instead.
;
; Capacity: each concurrent call needs one RTP port (RTCP is multiplexed
; via rtcp-mux only if negotiated; plain RTP/SRTP takes a second, adjacent
; port for RTCP unless rtcp_mux is on). 101 ports in this range is enough
; for roughly 25-50 simultaneous calls depending on that split -- plenty
; for the current demo/pilot scale. Widen the range (and the matching
; compose.yml ports: entry) if concurrency needs grow.
[general]
rtpstart=10000
rtpend=10100
