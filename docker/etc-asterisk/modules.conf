; modules.conf - minimal config for the Docker image.
;
; autoload=yes loads every module that was actually built (see the
; Dockerfile / menuselect defaults) without having to enumerate them here.
; noload lines below trim a few modules that either have unmet deps in
; this minimal image or that we simply don't need for the demo dialplan.

[modules]
autoload=yes

; Uncomment to explicitly keep a module from loading even though it was
; built, e.g.:
;noload => chan_console.so
