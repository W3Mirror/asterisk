; asterisk.conf - minimal config for the Docker image.
;
; Paths below match what `make install` puts under DESTDIR=/opt/asterisk-install
; in the Dockerfile (i.e. the compiled-in defaults), spelled out explicitly so
; they don't depend on the build's defaults staying the same across upgrades.

[directories](!)
astcachedir => /var/cache/asterisk
astetcdir => /etc/asterisk
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk
astkeydir => /var/lib/asterisk
astdatadir => /var/lib/asterisk
astagidir => /var/lib/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir => /var/run/asterisk
astlogdir => /var/log/asterisk
astsbindir => /usr/sbin

[options]
; The container is started directly as the non-root "asterisk" user (see
; Dockerfile `USER asterisk`), so there is no root process to drop
; privileges from -- runuser/rungroup are for the opposite case (Asterisk
; started as root and told to setuid/setgid down to an unprivileged user)
; and are intentionally left unset here. If you instead run the container
; as root, uncomment these two lines to have Asterisk drop privileges
; itself:
;runuser = asterisk
;rungroup = asterisk

; -f (foreground) and console verbosity are passed on the ENTRYPOINT
; command line instead of here, so they stay visible in `docker logs`
; regardless of what this file says.
nofork = yes
