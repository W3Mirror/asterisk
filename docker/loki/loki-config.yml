# Minimal single-binary Loki config for the aistack observability stack.
#
# Not exposed to the host (see compose.yml) -- only reachable at
# http://loki:3100 from other services on the aistack network (promtail
# pushes to it, Grafana queries it via the provisioned Loki datasource).
#
# Keeps everything on local filesystem storage in the loki-data named
# volume, with a 7-day retention so log volume doesn't grow unbounded on
# this single-node dev/demo deployment.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
