[workspace]
resolver = "2"
members = [
  "crates/sip-types",
  "crates/sip-parser",
  "crates/sdp",
  "crates/rtp",
  "crates/rtcp",
  "crates/dtmf",
  "crates/media-core",
  "crates/media-websocket",
  "crates/media-runtime",
  "crates/call-core",
  "crates/call-bridge",
  "crates/sip-transaction",
  "crates/sip-transport",
  "crates/sip-dialog",
  "crates/call-api",
  "crates/call-engine",
  "crates/call-runtime",
  "crates/sip-auth",
  "crates/provider-routing",
  "crates/sip-security",
  "crates/scenario-replay",
  "crates/property-tests",
  "crates/load-smoke",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
